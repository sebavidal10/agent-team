[project]
name = "local-agent-team"
version = "0.1.0"
description = "Equipo multiagente local para auditar y planificar mejoras de repositorios usando LangGraph + Ollama."
requires-python = ">=3.11"
dependencies = [
  "langgraph",
  "langchain-ollama",
  "python-dotenv",
  "pydantic>=2.0",
]

[project.scripts]
agent-team = "agent_team.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
